<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrativo - Viajecito</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <!-- VISTA 1: FORMULARIO DE AUTENTICACIÓN -->
  <div id="loginView" class="flex items-center justify-center min-h-screen px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-200">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full mb-3 text-2xl">
          🔒
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Panel de Administración</h1>
        <p class="text-xs text-gray-500 mt-1">Ingreso seguro con cifrado de backend</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Correo Electrónico</label>
          <input type="email" id="loginEmail" required autocomplete="username" placeholder="admin@agencia.com"
            class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Contraseña</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••"
            class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- SECCIÓN DINÁMICA DE 2FA (TOTP + CÓDIGO QR) -->
        <div id="totpGroup" class="hidden space-y-3 pt-2">
          <!-- Tarjeta del Código QR desplegada en enrolamiento por primera vez -->
          <div id="qrContainer" class="hidden bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-center space-y-2">
            <p class="text-xs font-bold text-indigo-900">Configuración de Seguridad 2FA</p>
            <p class="text-xs text-indigo-700">Escanea este código con Google Authenticator o Authy:</p>
            
            <div id="qrCodeWrapper" class="flex justify-center py-2 bg-white rounded-lg p-2 border border-indigo-100 max-w-[200px] mx-auto"></div>
            
            <p class="text-[10px] text-gray-500 font-mono break-all">Clave manual: <span id="secretCode" class="font-bold text-gray-800"></span></p>
          </div>

          <div>
            <label class="block text-xs font-semibold text-indigo-600 uppercase mb-1">Código Autenticador (2FA)</label>
            <input type="text" id="loginTotp" placeholder="123456" maxlength="6"
              class="w-full px-4 py-2 border border-indigo-300 rounded-lg text-sm text-center font-mono text-xl tracking-widest focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-indigo-50/30">
          </div>
        </div>

        <div id="loginError" class="hidden text-red-600 text-xs font-semibold bg-red-50 p-3 rounded-lg border border-red-200"></div>

        <button type="submit" id="loginBtn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition duration-200 shadow-md">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <!-- VISTA 2: DASHBOARD PRINCIPAL -->
  <div id="dashboardView" class="hidden flex flex-col min-h-screen">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
        <h1 class="text-base font-bold text-gray-900">Viajecito Admin</h1>
        <div class="flex items-center space-x-4">
          <span id="userEmailSpan" class="text-xs text-gray-600 font-medium"></span>
          <button id="logoutBtn" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-semibold px-3 py-1.5 rounded-lg">
            Cerrar Sesión
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-8">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-gray-800">Borradores Pendientes <span id="borradoresBadge" class="bg-indigo-100 text-indigo-800 text-xs px-2 py-0.5 rounded-full ml-1">0</span></h2>
      </div>
      <div id="borradoresList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
